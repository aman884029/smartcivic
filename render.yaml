services:
  - type: web
    name: smartcivic
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartcivic-db
          property: connectionString
      - key: ADMIN_NAME
        value: SmartCivic Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NGO_NAME
        value: SmartCivic NGO
      - key: NGO_EMAIL
        sync: false
      - key: NGO_PASSWORD
        sync: false

databases:
  - name: smartcivic-db
    plan: free
    region: singapore
    databaseName: smartcivic
    user: smartcivic
