services:
  - type: web
    name: smartcivic
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartcivic-db
          property: connectionString

databases:
  - name: smartcivic-db
    plan: free
    region: singapore
    databaseName: smartcivic
    user: smartcivic
